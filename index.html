<meta name="theme-color" content="#D4AF37">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>:root{--pr:#E91E8C;--prl:#FDE8F4;--bl:#3B82F6;--bll:#EFF6FF;--bld:#2563EB;--gr:#22C55E;--grb:#F0FDF4;--or:#F59E0B;--orb:#FFFBEB;--rd:#EF4444;--bg:#FDF5FB;--bgd:#FAE8F5;--wh:#fff;--tx:#2D2D2D;--mu:#9CA3AF;--br:#F3D0E9;--r:14px;--rs:10px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;min-height:100vh;padding-bottom:2.5rem}
.wrap{max-width:520px;margin:0 auto;padding:.75rem}
.hd{background:linear-gradient(135deg,#E91E8C,#7B2FF7 60%,#3B82F6);border-radius:22px;padding:1.25rem 1.5rem;margin-bottom:1rem;color:#fff;display:flex;justify-content:space-between;align-items:flex-start;box-shadow:0 6px 24px rgba(233,30,140,.25)}
.hd-left .hd-tag{font-size:11px;opacity:.85;letter-spacing:.06em;margin-bottom:4px;font-weight:600}
.hd-left .hd-title{font-size:20px;font-weight:700}
.hd-sub{margin-top:6px;font-size:12px;opacity:.8}
.hd-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;margin-top:2px}
.hd-user{background:rgba(255,255,255,.25);border-radius:16px;padding:3px 10px;font-size:12px;font-weight:600}
.hd-btn{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5);color:#fff;border-radius:20px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer}
.tabs{display:flex;gap:5px;margin-bottom:1rem;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:.45rem .75rem;border-radius:20px;border:1.5px solid var(--br);background:var(--wh);color:var(--mu);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.tab.on{background:linear-gradient(135deg,var(--pr),#7B2FF7);color:#fff;border-color:transparent;font-weight:700;box-shadow:0 2px 10px rgba(233,30,140,.3)}
.tab.at{border-color:#CDDFFE;color:var(--bl)}
.tab.at.on{background:linear-gradient(135deg,var(--bl),#7B2FF7);color:#fff;border-color:transparent}
.card{background:var(--wh);border:1.5px solid #F3D0E9;border-radius:var(--r);padding:.75rem 1rem;box-shadow:0 2px 12px rgba(233,30,140,.07)}
.sec{background:linear-gradient(135deg,#FDE8F4,#EFF6FF);border-radius:var(--r);padding:1rem 1.125rem;border:1.5px solid #E8C8F0}
.stack{display:flex;flex-direction:column;gap:10px}
.rb{display:flex;align-items:center;justify-content:space-between}
.pb{height:10px;background:#F9D0ED;border-radius:5px;overflow:hidden;margin:8px 0 3px}
.pb-f{height:100%;border-radius:5px;transition:width .5s;background:linear-gradient(90deg,var(--pr),var(--bl))}
.bd{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--grb);color:#16A34A;font-weight:700;white-space:nowrap;border:1px solid #BBF7D0}
.bv{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--bll);color:var(--bld);font-weight:700;white-space:nowrap;border:1px solid #BFDBFE}
.bw{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--orb);color:#D97706;white-space:nowrap;border:1px solid #FDE68A}
.wbdg{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--prl);color:var(--pr);font-weight:700;border:1px solid var(--br)}
.sbtn{font-size:12px;padding:6px 11px;border-radius:20px;border:1.5px solid var(--br);background:var(--wh);cursor:pointer;color:var(--mu);font-weight:500}
.sbtn.done{background:var(--grb);border-color:#BBF7D0;color:#16A34A;font-weight:700}
.sbtn.vac{background:var(--bll);border-color:#BFDBFE;color:var(--bld);font-weight:700}
.ir{display:flex;gap:8px;margin-bottom:10px}
.ir input,.ainp{flex:1;padding:.65rem .875rem;border-radius:var(--rs);border:1.5px solid var(--br);font-size:14px;background:var(--wh);color:var(--tx)}
.ir input:focus,.ainp:focus{outline:none;border-color:var(--pr)}
.abtn{padding:.6rem 1rem;border-radius:var(--rs);background:linear-gradient(135deg,var(--pr),#7B2FF7);color:#fff;border:none;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.abtn.sec{background:var(--bgd);color:var(--pr);border:1.5px solid var(--br)}
.abtn.full{width:100%;padding:.875rem;border-radius:var(--r);font-size:15px}
.abtn.sm{padding:.4rem .75rem;font-size:12px;border-radius:var(--rs)}
.st{font-size:14px;font-weight:700;margin-bottom:10px}
.dlb{background:none;border:none;cursor:pointer;color:#F9A8D4;font-size:16px;padding:0 2px}
.actb{font-size:12px;padding:4px 10px;border-radius:20px;border:1.5px solid var(--bl);background:var(--bll);cursor:pointer;color:var(--bl);font-weight:600}
.ws{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--br);background:var(--wh);cursor:pointer;font-size:16px;color:var(--pr);font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.stog{display:flex;align-items:center;justify-content:space-between;padding:.55rem .875rem;border-radius:var(--rs);background:var(--wh);font-size:13px;margin-bottom:5px;border:1.5px solid #F3D0E9}
.tgl{width:40px;height:22px;border-radius:11px;border:none;cursor:pointer;transition:background .2s;flex-shrink:0}
.tgl.on{background:linear-gradient(135deg,var(--pr),#7B2FF7)}.tgl.off{background:#E5E7EB}
.tgl.sm{width:34px;height:18px}
.sc-label{display:flex;align-items:center;gap:8px;padding:.45rem .5rem;font-size:13px;cursor:pointer;border-radius:8px}
.sc-label:hover{background:var(--prl)}
.sc-label input{width:16px;height:16px;cursor:pointer;accent-color:var(--pr)}
.cat-hd{font-size:11px;font-weight:700;color:var(--pr);letter-spacing:.05em;padding:.4rem 0 .2rem}
.mexp{border:1.5px solid #F9A8D4;border-radius:var(--r);overflow:hidden;margin-top:4px}
.mexp-hd{background:var(--prl);padding:.65rem 1rem;font-size:13px;font-weight:700;color:var(--pr)}
.mexp-body{padding:.5rem 1rem 1rem}
select{width:100%;padding:.65rem .875rem;border-radius:var(--rs);border:1.5px solid var(--br);font-size:14px;background:var(--wh);color:var(--tx)}
select:focus{outline:none;border-color:var(--pr)}
.loading{text-align:center;padding:3rem 1rem;color:var(--mu);font-size:14px}
.sp{width:30px;height:30px;border:3px solid #F9D0ED;border-top-color:var(--pr);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--mu);font-size:14px;padding:1.5rem 0}
.login-wrap{padding:.5rem 0}
.login-box{background:var(--wh);border:1.5px solid var(--br);border-radius:20px;padding:1.5rem;max-width:380px;margin:0 auto;box-shadow:0 2px 16px rgba(233,30,140,.1)}
.login-box h2{font-size:17px;text-align:center;margin-bottom:4px;font-weight:700}
.login-box p{font-size:13px;color:var(--mu);text-align:center;margin-bottom:1.25rem;line-height:1.6}
.lstack{display:flex;flex-direction:column;gap:10px}
.err{font-size:13px;color:var(--pr);text-align:center}
.ok{font-size:13px;color:var(--gr);text-align:center;font-weight:600}
.stat-box{flex:1;text-align:center;background:var(--wh);border-radius:var(--rs);padding:.875rem .5rem;border:1.5px solid #F3D0E9}
.stat-num{font-size:22px;font-weight:700;margin-top:4px}
.stat-label{font-size:11px;color:var(--mu);font-weight:500}
.fbox{background:var(--wh);border:1.5px solid #F3D0E9;border-radius:var(--r);padding:1rem}
.fg{flex:1;min-width:120px}
.fg label{font-size:11px;color:var(--mu);display:block;margin-bottom:4px;font-weight:600}
.rsum{display:flex;gap:6px;margin-bottom:8px}
.rsbox{flex:1;text-align:center;background:var(--prl);border-radius:var(--rs);padding:.5rem .25rem;border:1px solid var(--br)}
.rsnum{font-size:18px;font-weight:700}.rslbl{font-size:10px;color:var(--mu)}
.rtable{width:100%;border-collapse:collapse;font-size:12px}
.rtable th{background:var(--prl);color:var(--pr);font-weight:700;padding:.45rem .6rem;text-align:left;border-bottom:1.5px solid var(--br);white-space:nowrap}
.rtable td{padding:.4rem .6rem;border-bottom:1px solid #F9EDF5;vertical-align:middle}
.rtable tr:last-child td{border-bottom:none}
.tscroll{overflow-x:auto;border-radius:var(--r);border:1.5px solid #F3D0E9;max-height:400px;overflow-y:auto}
.mprog{background:var(--wh);border:1.5px solid #F3D0E9;border-radius:var(--r);padding:.875rem 1rem;cursor:pointer}
.mprog:hover{border-color:var(--pr)}
.wk-chip{display:inline-flex;align-items:center;font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600;white-space:nowrap;border:1.5px solid transparent}
.wk-open{background:var(--prl);color:var(--pr);border-color:var(--pr)}
.wk-locked{background:#F3F4F6;color:var(--mu);border-color:#E5E7EB}
.lock-btn{font-size:11px;padding:3px 8px;border-radius:20px;border:1.5px solid;cursor:pointer;font-weight:600}
.lock-btn.locked{background:#F3F4F6;color:var(--mu);border-color:#E5E7EB}
.lock-btn.open{background:var(--grb);color:var(--gr);border-color:#BBF7D0}
.add-wk-btn{font-size:12px;padding:4px 10px;border-radius:20px;border:1.5px solid var(--pr);background:var(--prl);color:var(--pr);cursor:pointer;font-weight:600;white-space:nowrap}

function fbLoad(){return fetch(FIREBASE_URL+DB_PATH).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(function(d){return d||{};});}
function fbSave(d){return fetch(FIREBASE_URL+DB_PATH,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(function(r){if(!r.ok)throw new Error(r.status);});}
// 체크인 전용 부분 저장: PATCH는 지정한 키만 갱신/삭제(null)하고 나머지 체크인은 건드리지 않음.
// 여러 명이 동시에 인증 버튼을 눌러도 서로의 체크인을 덮어쓰지 않기 위해 전체 PUT 대신 사용.
function fbPatchCheckins(patchObj){
  var path=DB_PATH.replace('.json','/checkins.json');
  return fetch(FIREBASE_URL+path,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(patchObj)}).then(function(r){if(!r.ok)throw new Error(r.status);});
}
function ckPatchOf(key){var o={};o[key]=(S.checkins[key]!==undefined)?S.checkins[key]:null;return o;}
async function persistCk(patchObj){
  S.saving=true;

  S.saving=false;render();
}

}
function ckKey(sid,wn,mid){return sid+'__'+wn+'__'+mid;}
function ck(sid,wn,mid){return S.checkins[ckKey(sid,wn,mid)]||null;}
function setCk(sid,wn,mid,val){var k=ckKey(sid,wn,mid);if(val)S.checkins[k]=val;else delete S.checkins[k];}

function rtnCk(sid,dk,mid){return S.checkins[rtnCkKey(sid,dk,mid)]||null;}
function setRtnCk(sid,dk,mid,val){var k=rtnCkKey(sid,dk,mid);if(val)S.checkins[k]=val;else delete S.checkins[k];}
// 루틴 메모 (키: sid+'__memo__'+dateKey+'__'+mid)

function rtnMemo(sid,dk,mid){return S.checkins[rtnMemoKey(sid,dk,mid)]||'';}
function setRtnMemo(sid,dk,mid,val){var k=rtnMemoKey(sid,dk,mid);if(val)S.checkins[k]=val;else delete S.checkins[k];}
// 이번주 월요일 날짜 반환
function getThisWeekMonday(){
  var d=new Date();d.setHours(0,0,0,0);
  var day=d.getDay();var diff=day===0?-6:1-day;
  d.setDate(d.getDate()+diff);return d;
}
// 날짜 → 'YYYY-MM-DD'
function toDateKey(d){return d.getFullYear()+'-'+(d.getMonth()+1+'').padStart(2,'0')+'-'+(d.getDate()+'').padStart(2,'0');}
// 날짜 → '26년 7월 10일(금)'
function toKorDate(d){
  var days=['일','월','화','수','목','금','토'];
  return (d.getFullYear()%100)+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일('+days[d.getDay()]+')';
}
// 스터디 이름순 정렬
function sortStudiesByName(arr){
  return arr.slice().sort(function(a,b){
    try{return a.name.localeCompare(b.name,'ko');}catch(e){return a.name<b.name?-1:a.name>b.name?1:0;}
  });
}
function allWeeks(s){return s.weeks||[];}
function openWeeks(s){return allWeeks(s).filter(function(w){return !w.locked;});}
function isStudyEnded(s){return s.cat&&s.cat.replace(/\s/g,'').indexOf('종료')>=0;}
function showCompleteCard(studyName,memberName,weekCount){
  var modal=document.getElementById('complete-modal');
  var canvas=document.getElementById('complete-canvas');
  if(!modal||!canvas)return;
  var ctx=canvas.getContext('2d');var W=600,H=800;
  canvas.width=W;canvas.height=H;
  var bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#1A1A2E');bg.addColorStop(0.4,'#16213E');bg.addColorStop(1,'#0F3460');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  var border=ctx.createLinearGradient(0,0,W,H);
  border.addColorStop(0,'#FFD700');border.addColorStop(0.5,'#FFF8DC');border.addColorStop(1,'#FFD700');
  ctx.strokeStyle=border;ctx.lineWidth=8;ctx.strokeRect(16,16,W-32,H-32);
  ctx.strokeStyle='rgba(255,215,0,.3)';ctx.lineWidth=2;ctx.strokeRect(24,24,W-48,H-48);
  function drawStar(cx,cy,r,color){
    ctx.save();ctx.beginPath();ctx.fillStyle=color;
    for(var i=0;i<5;i++){
      var a=Math.PI/180*(72*i-90);var b=Math.PI/180*(72*i-90+36);
      i===0?ctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a)):ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));
      ctx.lineTo(cx+r*0.4*Math.cos(b),cy+r*0.4*Math.sin(b));
    }
    ctx.closePath();ctx.fill();ctx.restore();
  }
  [[80,80,18],[520,80,14],[60,720,14],[540,720,18],[300,60,12],[150,150,8],[450,150,8]].forEach(function(s){drawStar(s[0],s[1],s[2],'rgba(255,215,0,0.6)');});
  ctx.font='120px serif';ctx.textAlign='center';
  ctx.shadowColor='rgba(255,200,0,.8)';ctx.shadowBlur=30;ctx.fillText('🏆',W/2,230);ctx.shadowBlur=0;
  var gold=ctx.createLinearGradient(0,250,0,310);
  gold.addColorStop(0,'#FFD700');gold.addColorStop(0.5,'#FFF8DC');gold.addColorStop(1,'#FFA500');
  ctx.fillStyle=gold;ctx.font='bold 52px sans-serif';
  ctx.shadowColor='rgba(255,165,0,.6)';ctx.shadowBlur=15;ctx.fillText('완  주  달  성',W/2,300);ctx.shadowBlur=0;
  var line=ctx.createLinearGradient(80,0,W-80,0);
  line.addColorStop(0,'transparent');line.addColorStop(0.5,'#FFD700');line.addColorStop(1,'transparent');
  ctx.strokeStyle=line;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(80,330);ctx.lineTo(W-80,330);ctx.stroke();
  ctx.fillStyle='#FFF8DC';ctx.font='bold 38px sans-serif';
  var maxW=460,words=studyName.split(''),ln='',lns=[];
  for(var i=0;i<words.length;i++){var t=ln+words[i];if(ctx.measureText(t).width>maxW&&ln){lns.push(ln);ln=words[i];}else ln=t;}lns.push(ln);
  var sy=390;lns.forEach(function(l){ctx.fillText(l,W/2,sy);sy+=50;});
  ctx.fillStyle='#FFD700';ctx.font='bold 44px sans-serif';
  ctx.shadowColor='rgba(255,200,0,.5)';ctx.shadowBlur=10;ctx.fillText(memberName,W/2,sy+40);ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,248,220,.8)';ctx.font='28px sans-serif';ctx.fillText(weekCount+'주 완주 🎉',W/2,sy+100);
  var today=new Date();
  var ds=today.getFullYear()+'.'+(today.getMonth()+1+'').padStart(2,'0')+'.'+(today.getDate()+'').padStart(2,'0');
  ctx.fillStyle='rgba(255,215,0,.6)';ctx.font='22px sans-serif';ctx.fillText(ds,W/2,sy+150);
  ctx.strokeStyle=line;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(80,sy+175);ctx.lineTo(W-80,sy+175);ctx.stroke();

  modal.style.display='flex';
  var sb=document.getElementById('complete-save');
  if(sb){sb.onclick=function(){var a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='완주_'+memberName+'_'+studyName+'.png';a.click();};}
  var cb=document.getElementById('complete-close');
  if(cb)cb.onclick=function(){modal.style.display='none';};
  modal.onclick=function(e){if(e.target===modal)modal.style.display='none';};
}
function showCelebration(emoji){
  var pop=document.createElement('div');
  pop.className='ck-pop';
  pop.textContent=emoji||'🎉';
  document.body.appendChild(pop);
  setTimeout(function(){pop.remove();},600);
  var colors=['#FF6B9D','#FFD93D','#6BCB77','#4D96FF','#C77DFF','#FF9A3C'];
  for(var i=0;i<22;i++){
    (function(i){
      setTimeout(function(){
        var c=document.createElement('div');
        c.className='confetti-piece';
        c.style.cssText='left:'+Math.random()*100+'vw;top:-10px;background:'+colors[Math.floor(Math.random()*colors.length)]+

          'animation-duration:'+(0.9+Math.random()*0.6)+'s;border-radius:'+(Math.random()>0.5?'50%':'3px')+';';
        document.body.appendChild(c);
        setTimeout(function(){c.remove();},1600);
      },i*40);

}
function showToast(msg,type,dur){
  var t=document.getElementById('toast');
  if(!t)return;
  t.textContent=msg;
  t.className='show '+(type||'info');
  clearTimeout(t._timer);
  t._timer=setTimeout(function(){t.className='';},dur||2500);
}
function mCurSt(m){
  var my=S.studies.filter(function(s){return s.active&&(m.studyIds||[]).indexOf(s.id)>=0;});
  var dn=0,tot=0;
  my.forEach(function(s){openWeeks(s).forEach(function(w){tot++;if(ck(s.id,w.num,m.id)==='done')dn++;});});
  return{total:tot,done:dn,pct:tot?Math.round(dn/tot*100):0};
}
function getCurrentWeek(s){
  if(!s.startDate)return 0;
  var start=new Date(s.startDate);start.setHours(0,0,0,0);
  var now=new Date();now.setHours(0,0,0,0);
  var diff=now-start;
  if(diff<0)return 0;
  return Math.floor(diff/(7*24*60*60*1000))+1;
}
function isStudyComplete(s,m){
  var aw=allWeeks(s);
  return aw.length>0&&aw.every(function(w){return ck(s.id,w.num,m.id)==='done';});
}
function getStudyBadge(s,m){
  var aw=allWeeks(s);if(!aw.length)return null;
  var done=aw.filter(function(w){return ck(s.id,w.num,m.id)==='done';}).length;
  var total=aw.length;var allDone=done===total;
  if(total===5&&allDone)return{badge:'💎',label:'다이아',color:'#22D3EE',bg:'#ECFEFF',border:'#22D3EE'};
  if(total>=8&&allDone)return{badge:'🥇',label:'금메달',color:'#D97706',bg:'#FEF3C7',border:'#D97706'};
  if(total>=8&&done>=8)return{badge:'🥈',label:'은메달',color:'#6B7280',bg:'#F3F4F6',border:'#9CA3AF'};
  return null;
}
function getMemberBadges(m){
  var badges=[];
  S.studies.filter(function(s){return s.active&&(m.studyIds||[]).indexOf(s.id)>=0;}).forEach(function(s){
    if(s.cat==='루틴 체크'){
      var rc=getRoutineDiamondCount(s.id,m.id);
      for(var i=0;i<rc;i++)badges.push({study:s,badge:{badge:'💎',label:'다이아',color:'#22D3EE',bg:'#ECFEFF',border:'#22D3EE'}});
      return;
    }
    var b=getStudyBadge(s,m);if(b)badges.push({study:s,badge:b});
  });
  return badges;
}
function mTotSt(m){
  var my=S.studies.filter(function(s){return s.active&&(m.studyIds||[]).indexOf(s.id)>=0;});
  var tw=0,dw=0,vw=0;
  my.forEach(function(s){allWeeks(s).forEach(function(w){tw++;var st=ck(s.id,w.num,m.id);if(st==='done')dw++;else if(st==='vacation')vw++;});});
  return{tw:tw,dw:dw,vw:vw,pct:tw?Math.round(dw/tw*100):0,cnt:my.length};
}
function sMSt(s,m){
  var aw=allWeeks(s);var dn=0,vc=0;
  aw.forEach(function(w){var st=ck(s.id,w.num,m.id);if(st==='done')dn++;else if(st==='vacation')vc++;});
  return{t:aw.length,dn:dn,vc:vc,pct:aw.length?Math.round(dn/aw.length*100):0};
}

// 앱 레벨 이벤트 위임 (re-render 후에도 항상 동작)
document.addEventListener('click',function(e){
  var expci=e.target.closest&&e.target.closest('[data-expci]');
  if(expci){e.stopPropagation();var id=expci.dataset.expci;S.expandedCI[id]=!S.expandedCI[id];render();return;}
  var wnttog=e.target.closest&&e.target.closest('[data-wnttog]');
  if(wnttog){e.stopPropagation();var wk=wnttog.dataset.wnttog;S.expandedWnote[wk]=!S.expandedWnote[wk];render();return;}
  var allopen=e.target.closest&&e.target.closest('[data-allopen]');
  if(allopen){e.stopPropagation();var s=S.studies.filter(function(x){return x.id===allopen.dataset.allopen;})[0];if(s&&s.weeks){s.weeks.forEach(function(w){w.locked=false;});persist();}return;}
  var alllock=e.target.closest&&e.target.closest('[data-alllock]');
  if(alllock){e.stopPropagation();var s2=S.studies.filter(function(x){return x.id===alllock.dataset.alllock;})[0];if(s2&&s2.weeks){s2.weeks.forEach(function(w){w.locked=true;});persist();}return;}
});

function rApp(){
  var ia=S.isAdmin,im=!!S.loggedMember;
  var h='<div class="hd"><div class="hd-left"><div class="hd-tag">@kkang_twins_</div><div class="hd-title">책육아 스터디</div>'+

// 루틴 월별 뱃지: 해당 월 경과일 대비 50% 이상 인증 시 💎
function getRoutineMonthBadge(sid,mid,yr,mo){
  var lastDate=new Date(yr,mo+1,0).getDate();
  var today=new Date();var done=0,total=0;
  for(var d=1;d<=lastDate;d++){
    var dt=new Date(yr,mo,d);if(dt>today)break;
    var dk=yr+'-'+(mo+1+'').padStart(2,'0')+'-'+(d+'').padStart(2,'0');
    total++;if(rtnCk(sid,dk,mid)==='done')done++;
  }
  return total>0&&done/total>=0.5;
}
// 루틴 누적 다이아 개수: 체크인 기록이 있는 달들 중 50% 이상 달성한 달의 개수(매달 쌓임)
function getRoutineDiamondCount(sid,mid){
  var yms={};
  Object.keys(S.checkins).forEach(function(k){
    var p=k.split('__');
    if(p[0]===sid&&p[1]==='date'&&p[3]===mid)yms[p[2].slice(0,7)]=true;
  });
  var cnt=0;
  Object.keys(yms).forEach(function(ym){
    var yr=+ym.slice(0,4),mo=+ym.slice(5,7)-1;
    if(getRoutineMonthBadge(sid,mid,yr,mo))cnt++;
  });
  return cnt;
}

// ── 루틴 월별 달력 모달 ──
function rRoutineCal(sid, mid, ym){
  var s=S.studies.filter(function(x){return x.id===sid;})[0];
  var m=S.members.filter(function(x){return x.id===mid;})[0];
  if(!s||!m)return '';
  var today=new Date();
  var ymKey=ym||(today.getFullYear()+'-'+(today.getMonth()+1+'').padStart(2,'0'));
  var yma=ymKey.split('-');var yr=+yma[0],mo=+yma[1]-1;
  var firstDay=new Date(yr,mo,1).getDay();
  if(firstDay===0)firstDay=7; // 월요일 시작
  firstDay=firstDay-1;
  var lastDate=new Date(yr,mo+1,0).getDate();
  var prevYm=mo===0?(yr-1)+'-12':yr+'-'+(mo+'').padStart(2,'0');
  var nextYm=mo===11?(yr+1)+'-01':yr+'-'+(mo+2+'').padStart(2,'0');
  var canNext=new Date(yr,mo+1,1)<=today;

  var h='<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;" id="rtn-cal-modal">';

  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">';
  h+='<button data-rtn-cal-ym="'+prevYm+'__'+sid+'__'+mid+'" style="padding:4px 10px;border-radius:20px;border:1px solid var(--br);background:var(--wh);cursor:pointer;font-size:12px;">◀</button>';
  h+='<span style="font-size:13px;font-weight:700;color:var(--pr);">'+yr+'년 '+(mo+1)+'월</span>';
  h+='<button data-rtn-cal-ym="'+nextYm+'__'+sid+'__'+mid+'" style="padding:4px 10px;border-radius:20px;border:1px solid var(--br);background:var(--wh);cursor:pointer;font-size:12px;opacity:'+(canNext?'1':'0.3')+';pointer-events:'+(canNext?'auto':'none')+';">▶</button>';
  h+='</div>';
  // 달력 헤더
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px;">';
  ['월','화','수','목','금','토','일'].forEach(function(d,i){
    h+='<div style="text-align:center;font-size:10px;font-weight:700;color:'+(i>=5?'#EF4444':'var(--mu)')+';">'+d+'</div>';
  });
  h+='</div>';
  // 달력 날짜
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;">';
  for(var i=0;i<firstDay;i++)h+='<div></div>';
  var doneCnt=0,totalCnt=0;
  for(var d=1;d<=lastDate;d++){
    var dk=yr+'-'+(mo+1+'').padStart(2,'0')+'-'+(d+'').padStart(2,'0');
    var st=rtnCk(sid,dk,mid);
    var dateObj=new Date(yr,mo,d);
    var isFuture=dateObj>today;
    var dow=dateObj.getDay();
    var isWeekend=dow===0||dow===6;
    if(!isFuture)totalCnt++;
    if(st==='done')doneCnt++;
    var bg=st==='done'?'var(--pr)':st==='vacation'?'#3B82F6':isWeekend?'#FEF2F2':'#F8F9FA';
    var txtCol=st==='done'||st==='vacation'?'#fff':isWeekend?'#EF4444':'var(--tx)';
    var calMemo=rtnMemo(sid,dk,mid);
    h+='<div style="position:relative;">';

    if(calMemo)h+='<div style="position:absolute;bottom:-1px;right:-1px;width:7px;height:7px;background:#F59E0B;border-radius:50%;border:1.5px solid #fff;"></div>';

  h+='</div>';

  h+='</div></div>';
  return h;

          '<div style="font-size:16px;color:var(--mu);margin-top:18px;">~</div>'+
          '<div style="flex:1;"><div style="font-size:11px;color:var(--mu);margin-bottom:3px;">종료일 <span style="color:var(--or);">(하루면 비워두기)</span></div>'+
          '<input type="date" id="ev-end" class="ainp" style="width:100%;padding:.5rem .75rem;font-size:13px;"></div>'+
        '</div>'+
        '<div style="display:flex;gap:8px;">'+
          '<select id="ev-color" style="flex:1;padding:.6rem .75rem;border-radius:var(--rs);border:1.5px solid var(--br);font-size:13px;background:var(--wh);margin:0;">'+
            '<option value="#E91E8C">🩷 분홍</option>'+
            '<option value="#3B82F6">💙 파랑</option>'+
            '<option value="#22C55E">💚 초록</option>'+
            '<option value="#F59E0B">🧡 주황</option>'+
            '<option value="#7B2FF7">💜 보라</option>'+
          '</select>'+
          '<button class="abtn" id="ev-add">추가</button>'+
        '</div>'+
      '</div></div>';
  }

  // 달력 그리드
  h+='<div style="background:var(--wh);border:1.5px solid #F3D0E9;border-radius:var(--r);overflow:hidden;">';
  // 요일 헤더
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);background:var(--prl);">';
  dayNames.forEach(function(d,i){
    h+='<div style="text-align:center;padding:.5rem 0;font-size:12px;font-weight:700;color:'+(i===0?'var(--rd)':i===6?'var(--bl)':'var(--tx)')+';">'+d+'</div>';
  });
  h+='</div>';
  // 날짜 그리드
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);">';
  for(var i=0;i<firstDay;i++) h+='<div style="min-height:60px;border-top:1px solid #F9EDF5;"></div>';
  for(var d=1;d<=lastDate;d++){
    var dateStr=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var dayEvs=Object.values(S.events).filter(function(e){
      var s=e.startDate||e.date;var en=e.endDate||s;
      return dateStr>=s&&dateStr<=en;
    });
    var isToday=dateStr===todayStr;
    var dow=(firstDay+d-1)%7;
    h+='<div style="min-height:60px;border-top:1px solid #F9EDF5;padding:3px;'+(isToday?'background:var(--prl);':'')+'">'+
      '<div style="font-size:12px;font-weight:'+(isToday?'700':'400')+';color:'+(isToday?'var(--pr)':dow===0?'var(--rd)':dow===6?'var(--bl)':'var(--tx)')+';margin-bottom:2px;">'+d+'</div>';
    dayEvs.forEach(function(ev){
      var s=ev.startDate||ev.date;var en=ev.endDate||s;
      var isStart=dateStr===s;var isEnd=dateStr===en;var isSingle=s===en;
      var br=isSingle?'4px':(isStart?'4px 0 0 4px':(isEnd?'0 4px 4px 0':'0'));
      var label=isStart?esc(ev.title.length>8?ev.title.slice(0,8)+'...':ev.title):'';
      h+='<div style="font-size:10px;font-weight:600;color:#fff;background:'+ev.color+';border-radius:'+br+';padding:1px 4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:'+(isStart?1:0.75)+';" title="'+esc(ev.title)+'">'+
        label+

      '</div>';
    });
    h+='</div>';
  }
  h+='</div></div>';

  // 이번달 일정 목록
  var moPrefix=yr+'-'+String(mo+1).padStart(2,'0');
  var moEvs=Object.values(S.events).filter(function(e){
    var s=e.startDate||e.date;var en=e.endDate||s;
    return s.startsWith(moPrefix)||en.startsWith(moPrefix)||(s<moPrefix&&en>moPrefix+'-31');
  }).sort(function(a,b){var sa=a.startDate||a.date;var sb=b.startDate||b.date;return sa>sb?1:-1;});

    moEvs.forEach(function(ev){
      var sd=ev.startDate||ev.date;var ed=ev.endDate||sd;
      var d1=new Date(sd);var dow2=d1.getDay();
      var dowName=['일','월','화','수','목','금','토'][dow2];
      var dateDisplay=sd===ed?sd.slice(5).replace('-','/')+'('+dowName+')':sd.slice(5).replace('-','/') + ' ~ ' + ed.slice(5).replace('-','/');

        '<span style="font-size:12px;color:var(--mu);white-space:nowrap;">'+dateDisplay+'</span>'+
        '<span style="font-size:13px;font-weight:500;flex:1;">'+esc(ev.title)+'</span>'+
        (S.isAdmin?'<button class="ev-del" data-evid="'+ev.id+'" style="font-size:11px;padding:2px 6px;border-radius:20px;border:1.5px solid #FECACA;background:#FFF5F5;color:var(--rd);cursor:pointer;">삭제</button>':'')+
      '</div>';
    });
    h+='</div>';
  }
  return h+'</div>';
}

function rOV(){
  if(!S.isAdmin)return rAL();
  if(S.viewMemberId){
    var vm=S.members.filter(function(x){return x.id===S.viewMemberId;})[0];
    if(vm){
      var vmy=S.studies.filter(function(s){return s.active&&(vm.studyIds||[]).indexOf(s.id)>=0;});
      var vtot=mTotSt(vm);
      // catOrder 기준 카테고리 정렬
      var vmCats=[];
      (S.catOrder.length?S.catOrder:vmy.map(function(s){return s.cat;})).forEach(function(c){
        if(vmCats.indexOf(c)<0&&vmy.some(function(s){return s.cat===c;}))vmCats.push(c);
      });
      var h='<div class="stack"><div class="sec rb" style="padding:.875rem 1rem;">'+

          '<div style="font-size:12px;color:var(--mu);margin-top:2px;">누적 ✅'+vtot.dw+'/'+vtot.tw+'주 · '+vtot.pct+'%</div></div>'+
        '<button class="abtn sec" id="vm-back" style="font-size:12px;padding:4px 10px;">← 목록으로</button></div>';
      vmCats.forEach(function(cat){
        var catStudies=vmy.filter(function(s){return s.cat===cat;});
        if(!catStudies.length)return;
        var vmCatKey=vm.id+'__'+cat;
        var vmCatOpen=S.expandedVmCat[vmCatKey]!==false;
        // 카테고리 헤더 (토글)
        h+='<div style="display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--pr),#7B2FF7);border-radius:20px;padding:5px 12px;margin-bottom:6px;cursor:pointer;" data-vmcattog="'+esc(vmCatKey)+'">'+
          '<span style="font-size:12px;font-weight:700;color:#fff;">'+esc(cat)+'</span>'+
          '<span style="font-size:12px;color:rgba(255,255,255,.8);">'+(vmCatOpen?'▲':'▼')+'</span>'+
        '</div>';
        if(!vmCatOpen)return;
        catStudies.forEach(function(s){
          var aw=allWeeks(s);
          var vmStKey=vm.id+'__'+s.id;
          var vmStOpen=S.expandedVmSt[vmStKey]===true;
          var doneC=aw.filter(function(w){return ck(s.id,w.num,vm.id)==='done';}).length;
          var vacC=aw.filter(function(w){return ck(s.id,w.num,vm.id)==='vacation';}).length;
          // 스터디 헤더 (토글)
          h+='<div style="border:1.5px solid var(--br);border-radius:var(--rs);margin-bottom:6px;overflow:hidden;">';
          h+='<div style="display:flex;align-items:center;gap:8px;padding:.45rem .75rem;background:var(--wh);cursor:pointer;" data-vmstog="'+esc(vmStKey)+'">'+
            '<span style="flex:1;font-size:13px;font-weight:600;color:var(--tx);">'+esc(s.name)+'</span>'+
            '<span style="font-size:11px;color:var(--mu);">✅'+doneC+' 🏖️'+vacC+'/'+aw.length+'주</span>'+
            '<span style="font-size:12px;color:var(--mu);margin-left:4px;">'+(vmStOpen?'▲':'▼')+'</span>'+
          '</div>';
          if(vmStOpen){
            h+='<div style="background:#FAFAFA;padding:.5rem .75rem;">';
            aw.forEach(function(w){
              var status=ck(s.id,w.num,vm.id);var isOpen=!w.locked;
              var cwk=getCurrentWeek(s);var isCW=cwk>0&&w.num===cwk;
              h+='<div style="display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid #F3F4F6;">';
              h+='<span class="wk-chip '+(isOpen?'wk-open':'wk-locked')+(isCW?' wk-curweek':'')+'" style="font-size:11px;min-width:60px;">'+(isCW?'⭐ ':'')+w.num+'주차</span>';
              if(isOpen){
                h+='<button class="sbtn'+(status==='done'?' done':'')+'" data-ack="'+vm.id+'__'+s.id+'__'+w.num+'__done">✅ 인증</button>'+
                  '<button class="sbtn'+(status==='vacation'?' vac':'')+'" data-ack="'+vm.id+'__'+s.id+'__'+w.num+'__vacation">🏖️ 휴가</button>'+
                  (status?'<button class="sbtn" data-ack="'+vm.id+'__'+s.id+'__'+w.num+'__none" style="font-size:11px;">✕</button>':'');
              } else {
                h+=(status==='done'?'<span class="bd">✓ 인증완료</span>':status==='vacation'?'<span class="bv">🏖️ 휴가</span>':'<span style="font-size:11px;color:var(--mu);">미인증</span>');
              }
              h+='</div>';
            });
            h+='</div>';
          }
          h+='</div>';
        });
      });
      return h+'</div>';
    }
  }
  var ad=S.members.filter(function(m){var s=mCurSt(m);return s.total>0&&s.done===s.total;}).length;

  // ── 알림 패널 ──
  var now=new Date();
  var todayStr=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  // 이번주 월요일~일요일
  var weekDay=now.getDay();var mondayOff=weekDay===0?-6:1-weekDay;
  var monday=new Date(now);monday.setDate(now.getDate()+mondayOff);
  var sunday=new Date(monday);sunday.setDate(monday.getDate()+6);
  function toStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  var monStr=toStr(monday);var sunStr=toStr(sunday);

  // 🔴 열린 주차가 없는 활성 스터디
  // 종료된 스터디 = 카테고리가 '종료된스터디'
  var noOpen=S.studies.filter(function(s){return s.active&&openWeeks(s).length===0&&!isStudyEnded(s);});
  // 🟡 이번주 인증률 0%인 스터디 (열린 주차 있는데 아무도 인증 안 함)
  var zeroRate=S.studies.filter(function(s){
    if(!s.active||openWeeks(s).length===0||isStudyEnded(s))return false;
    var enrolled=S.members.filter(function(m){return(m.studyIds||[]).indexOf(s.id)>=0;});
    if(!enrolled.length)return false;
    var total=0,done=0;
    enrolled.forEach(function(m){openWeeks(s).forEach(function(w){total++;if(ck(s.id,w.num,m.id)==='done')done++;});});
    return total>0&&done===0;
  });
  // 📅 이번주 달력 일정
  var weekEvs=Object.values(S.events).filter(function(e){
    var s=e.startDate||e.date;var en=e.endDate||s;
    return s<=sunStr&&en>=monStr;
  }).sort(function(a,b){var sa=a.startDate||a.date;var sb=b.startDate||b.date;return sa>sb?1:-1;});

  var hasAlert=noOpen.length||zeroRate.length||weekEvs.length;
  var h='<div class="stack">';
  if(hasAlert){
    h+='<div style="background:var(--wh);border:1.5px solid #F3D0E9;border-radius:var(--r);padding:.875rem 1rem;">'+
      '<div style="font-size:13px;font-weight:700;color:var(--pr);margin-bottom:8px;">📋 이번주 할 일</div>';
    if(noOpen.length){
      h+='<div style="margin-bottom:8px;"><div style="font-size:12px;font-weight:700;color:var(--rd);margin-bottom:4px;">🔴 주차를 열어야 해요 ('+noOpen.length+'개)</div>';
      noOpen.forEach(function(s){
        h+='<div style="font-size:12px;padding:.3rem .5rem;background:#FFF5F5;border-radius:8px;margin-bottom:3px;display:flex;align-items:center;justify-content:space-between;">'+
          '<span>'+esc(s.name)+'<span style="font-size:10px;color:var(--mu);margin-left:4px;">['+esc(s.cat)+']</span></span>'+
          '<span style="font-size:10px;color:var(--rd);">열린 주차 없음</span></div>';
      });
      h+='</div>';
    }
    if(zeroRate.length){
      h+='<div style="margin-bottom:8px;"><div style="font-size:12px;font-weight:700;color:var(--or);margin-bottom:4px;">🟡 인증 독려 필요 ('+zeroRate.length+'개)</div>';
      zeroRate.forEach(function(s){
        var enrolled=S.members.filter(function(m){return(m.studyIds||[]).indexOf(s.id)>=0;});
        h+='<div style="font-size:12px;padding:.3rem .5rem;background:var(--orb);border-radius:8px;margin-bottom:3px;display:flex;align-items:center;justify-content:space-between;">'+
          '<span>'+esc(s.name)+'<span style="font-size:10px;color:var(--mu);margin-left:4px;">['+esc(s.cat)+']</span></span>'+
          '<span style="font-size:10px;color:var(--or);">'+enrolled.length+'명 0% 인증</span></div>';
      });
      h+='</div>';
    }
    if(weekEvs.length){
      h+='<div><div style="font-size:12px;font-weight:700;color:var(--bl);margin-bottom:4px;">📅 이번주 일정 ('+weekEvs.length+'개)</div>';
      weekEvs.forEach(function(ev){
        var sd=ev.startDate||ev.date;var ed=ev.endDate||sd;
        var dateDisplay=sd===ed?sd.slice(5).replace('-','/'):sd.slice(5).replace('-','/')+' ~ '+ed.slice(5).replace('-','/');
        h+='<div style="font-size:12px;padding:.3rem .5rem;background:var(--bll);border-radius:8px;margin-bottom:3px;display:flex;align-items:center;gap:6px;">'+
          '<div style="width:8px;height:8px;border-radius:50%;background:'+ev.color+';flex-shrink:0;"></div>'+
          '<span style="color:var(--mu);white-space:nowrap;">'+dateDisplay+'</span>'+
          '<span style="font-weight:500;">'+esc(ev.title)+'</span></div>';
      });
      h+='</div>';
    }
    h+='</div>';
  }
  h+='<div style="display:flex;gap:8px;">'+
    '<div class="stat-box"><div class="stat-label">전체 멤버</div><div class="stat-num" style="color:var(--pr);">'+S.members.length+'</div></div>'+
    '<div class="stat-box"><div class="stat-label">✅ 이번주 완료</div><div class="stat-num" style="color:var(--gr);">'+ad+'</div></div>'+
    '<div class="stat-box"><div class="stat-label">⏳ 미완료</div><div class="stat-num" style="color:var(--or);">'+(S.members.length-ad)+'</div></div>'+
    '</div>';
  // 완주 현황 (카테고리별)
  var completeData=[];
  S.studies.filter(function(s){return s.active;}).forEach(function(s){
    var completers=S.members.filter(function(m){return(m.studyIds||[]).indexOf(s.id)>=0&&isStudyComplete(s,m);});
    if(completers.length>0)completeData.push({study:s,completers:completers});
  });
  if(completeData.length){
    var completeCats=[];
    completeData.forEach(function(d){if(completeCats.indexOf(d.study.cat)<0)completeCats.push(d.study.cat);});
    // 카테고리 순서: catOrder 기준, 없으면 지정순서 사용
    var catPriority=['루틴 체크','입문스터디','엄세스','방출스터디','멤버전용'];
    completeCats.sort(function(a,b){
      var orderA=S.catOrder.length?S.catOrder.indexOf(a):catPriority.indexOf(a);
      var orderB=S.catOrder.length?S.catOrder.indexOf(b):catPriority.indexOf(b);
      if(orderA<0)orderA=999;if(orderB<0)orderB=999;
      return orderA-orderB;
    });
    h+='<div style="background:linear-gradient(135deg,#FFFBEB,#FFF7ED);border:1.5px solid #FDE68A;border-radius:var(--r);padding:.875rem 1rem;">'+
      '<div style="font-size:13px;font-weight:700;color:#D97706;margin-bottom:10px;">🏆 완주 현황</div>';
    completeCats.forEach(function(cat){
      var catData=completeData.filter(function(d){return d.study.cat===cat;});
      h+='<div style="margin-bottom:10px;">'+
        '<div style="font-size:11px;font-weight:700;color:#92400E;background:#FEF3C7;padding:3px 10px;border-radius:20px;display:inline-block;margin-bottom:6px;">'+esc(cat)+'</div>';
      catData.forEach(function(d){
        h+='<div style="margin-bottom:5px;padding:.35rem .5rem;background:rgba(255,255,255,.6);border-radius:var(--rs);">'+
          '<div style="font-size:12px;font-weight:600;color:var(--tx);margin-bottom:4px;">'+esc(d.study.name)+' <span style="color:#D97706;font-size:11px;">'+d.completers.length+'명</span></div>'+
          '<div style="display:flex;flex-wrap:wrap;gap:4px;">'+
          d.completers.map(function(mem){
            var b=getStudyBadge(d.study,mem);
            var icon=b?b.badge:'🏆';var col=b?b.color:'#D97706';var bg=b?b.bg:'#FEF3C7';
            return '<span style="font-size:11px;padding:2px 8px;background:'+bg+';border:1.5px solid '+col+';border-radius:20px;color:'+col+';">'+icon+' '+esc(mem.name)+'</span>';
          }).join('')+
          '</div></div>';
      });
      h+='</div>';
    });
    h+='</div>';
  }
  S.members.forEach(function(m){

function xCsv(){
  var rows=bRows();var lines=[['멤버','스터디','카테고리','주차','총주차','잠금','상태'].join(',')];
  rows.forEach(function(r){
    var row=[r.mem,r.study,r.cat,r.week+'주차',r.tw+'주',r.locked?'잠금':'열림',r.st==='done'?'인증완료':r.st==='vacation'?'휴가':'미인증'];
    lines.push(row.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(','));
  });
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'}));
  a.download='스터디인증.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);
}
function xCopy(){

  qsa('.notice-img',function(el){el.addEventListener('error',function(){el.style.display='none';});});
  // 이미지 파일 업로드
  var ntImgData='';
  function compressImage(file,cb){
    var reader=new FileReader();
    reader.onload=function(e){
      var img=new Image();
      img.onload=function(){
        var MAX=900;var w=img.width,h=img.height;
        if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
        if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
        var cv=document.createElement('canvas');cv.width=w;cv.height=h;
        var ctx=cv.getContext('2d');ctx.drawImage(img,0,0,w,h);
        var out=cv.toDataURL('image/jpeg',0.6);
        if(out.length>500000){out=cv.toDataURL('image/jpeg',0.4);}
        if(out.length>700000){alert('이미지가 너무 커요. 더 작은 이미지를 사용해주세요.');return;}
        cb(out);
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  }
  function setNtPreview(dataUrl){
    ntImgData=dataUrl;
    var prev=g('nt-preview');var pimg=g('nt-preview-img');
    if(prev&&pimg){pimg.src=dataUrl;prev.style.display='block';}
    var drop=g('nt-drop');if(drop)drop.style.display='none';
  }
  var ntDrop=g('nt-drop');var ntFile=g('nt-file');
  if(ntDrop){
    ntDrop.addEventListener('click',function(){if(ntFile)ntFile.click();});
    ntDrop.addEventListener('dragover',function(e){e.preventDefault();ntDrop.style.borderColor='var(--pr)';});
    ntDrop.addEventListener('dragleave',function(){ntDrop.style.borderColor='var(--br)';});
    ntDrop.addEventListener('drop',function(e){
      e.preventDefault();ntDrop.style.borderColor='var(--br)';
      var f=e.dataTransfer.files[0];
      if(f&&f.type.startsWith('image/')){
        var up=g('nt-uploading');if(up)up.style.display='block';
        compressImage(f,function(d){if(up)up.style.display='none';setNtPreview(d);});
      }
    });
  }
  if(ntFile){ntFile.addEventListener('change',function(e){
    var f=e.target.files[0];if(!f)return;

  // 주차 공지 메모
  qsa('[data-wnote]',function(el){el.addEventListener('blur',function(e){
    var p=el.dataset.wnote.split('__');var sid=p[0],wn=+p[1];
    var s=S.studies.filter(function(x){return x.id===sid;})[0];if(!s)return;
    var w=s.weeks.filter(function(x){return x.num===wn;})[0];if(!w)return;
    w.note=e.target.value;persist();
  });});
  // 자료 링크
  qsa('[data-mat]',function(el){el.addEventListener('blur',function(e){
    var p=el.dataset.mat.split('__');var sid=p[0],wn=+p[1];
    var s=S.studies.filter(function(x){return x.id===sid;})[0];if(!s)return;
    var w=s.weeks.filter(function(x){return x.num===wn;})[0];if(!w)return;
    w.materialUrl=e.target.value.trim();persist();
  });});
  // 주차 일괄생성
  qsa('[data-addwk]',function(el){el.addEventListener('click',function(){
    var sid=el.dataset.addwk;var s=S.studies.filter(function(x){return x.id===sid;})[0];if(!s)return;
    var inp=g('wkin-'+sid);var total=inp?+inp.value:0;
    if(!total||total<1||total>52){alert('1~52 사이 숫자를 입력해주세요');return;}
    var added=0;for(var i=1;i<=total;i++){if(!s.weeks.filter(function(x){return x.num===i;}).length){s.weeks.push({num:i,locked:false,materialUrl:''});added++;}}
    s.weeks.sort(function(a,b){return a.num-b.num;});if(inp)inp.value='';
    if(!added)alert('이미 1~'+total+'주차가 모두 있어요!');persist();
  });});
  // allopen/alllock: 앱 레벨 위임으로 처리
  // 다음 주차
  qsa('[data-addnext]',function(el){el.addEventListener('click',function(){
    var s=S.studies.filter(function(x){return x.id===el.dataset.addnext;})[0];if(!s)return;
    var aw=s.weeks||[];var next=aw.length?Math.max.apply(null,aw.map(function(x){return x.num;}))+1:1;
    s.weeks.push({num:next,locked:false,materialUrl:''});persist();
  });});
  // 새 스터디 추가 - 카테고리 선택
  var nsCat=g('ns-cat');
  if(nsCat)nsCat.addEventListener('change',function(e){
    var nc=g('ns-newcat');if(nc)nc.style.display=e.target.value==='__new__'?'block':'none';
  });
  on('add-study',function(){
    var ni=g('ns-name');var ci=g('ns-cat');var nci=g('ns-newcat');
    var name=ni?ni.value.trim():'';var cat=ci?ci.value:'';
    if(cat==='__new__'){cat=nci?nci.value.trim():'';}
    if(!name){alert('스터디 이름을 입력해주세요');return;}
    if(!cat){alert('카테고리를 선택하거나 입력해주세요');return;}
    if(S.studies.filter(function(x){return x.name===name;}).length){alert('같은 이름이 이미 있어요!');return;}
    S.studies.push({id:'s'+Date.now().toString(36),name:name,cat:cat,active:true,applyOpen:false,dayOfWeek:'',bandUrl:'',weeks:[{num:1,locked:false,materialUrl:''}]});
    if(S.catOrder.indexOf(cat)<0)S.catOrder.push(cat);
    if(ni)ni.value='';if(ci)ci.value='';if(nci){nci.value='';nci.style.display='none';}persist();
  });
  // 루틴 추가
  on('add-routine',function(){
    var ni=g('nr-name');
    var name=ni?ni.value.trim():'';
    if(!name){alert('루틴 이름을 입력해주세요');return;}
    if(S.studies.filter(function(x){return x.name===name;}).length){alert('같은 이름이 이미 있어요!');return;}
    var cat='루틴 체크';
    var newId='rtn_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
    S.studies.push({id:newId,name:name,cat:cat,active:true,applyOpen:false,dayOfWeek:'',bandUrl:'',weeks:[{num:1,locked:false,materialUrl:''}]});
    if(S.catOrder.indexOf(cat)<0)S.catOrder.unshift(cat);
    if(ni)ni.value='';
    showToast('✅ 루틴이 추가됐어요!','success');
    persist();render();
  });
  // 멤버 관리
  var nm=g('nm');if(nm){nm.addEventListener('input',function(e){S.newMember=e.target.value;});nm.addEventListener('keydown',function(e){if(e.key==='Enter')doAM();});}
  var nmpw=g('nm-pw');if(nmpw)nmpw.addEventListener('keydown',function(e){if(e.key==='Enter')doAM();});
  on('am',doAM);
  qsa('[data-mren]',function(el){el.addEventListener('change',function(e){
    var newName=e.target.value.trim();if(!newName)return;
    var m=S.members.filter(function(x){return x.id===el.dataset.mren;})[0];if(!m)return;
    if(S.loggedMember&&S.loggedMember.id===m.id)S.loggedMember.name=newName;
    m.name=newName;
    S.members.sort(function(a,b){try{return a.name.localeCompare(b.name,'ko');}catch(e2){return a.name<b.name?-1:1;}});
    persist();
  });});
  qsa('[data-mexp]',function(el){el.addEventListener('click',function(){S.expandedMem=S.expandedMem===el.dataset.mexp?null:el.dataset.mexp;render();});});
  qsa('[data-md]',function(el){el.addEventListener('click',function(){doDM(el.dataset.md);});});
  qsa('[data-asgn]',function(el){el.addEventListener('change',function(e){
    var p=e.target.dataset.asgn.split('__');var mid=p[0],sid=p[1];
    var m=S.members.filter(function(x){return x.id===mid;})[0];if(!m)return;
    m.studyIds=m.studyIds||[];
    if(e.target.checked){if(m.studyIds.indexOf(sid)<0)m.studyIds.push(sid);}
    else m.studyIds=m.studyIds.filter(function(x){return x!==sid;});persist();
  });});
  qsa('[data-ap]',function(el){el.addEventListener('click',function(){
    var mid=el.dataset.ap;var inp=g('ap'+mid);if(!inp)return;
    var nv=inp.value.trim();if(!nv){alert('새 비밀번호를 입력해주세요');return;}
    var m=S.members.filter(function(x){return x.id===mid;})[0];if(!m)return;
    m.pw=nv;persist();inp.value='';alert(m.name+'님 비번 변경 완료!');
  });});
  qsa('[data-sexp]',function(el){el.addEventListener('click',function(){S.expandedStudy=S.expandedStudy===el.dataset.sexp?null:el.dataset.sexp;render();});});
  // 스터디 멤버 섹션 펼치기
  qsa('[data-expsm]',function(el){el.addEventListener('click',function(){
    var sid=el.dataset.expsm;S.expandedStudyMem[sid]=!S.expandedStudyMem[sid];render();
  });});
  // 전체 인증완료
  qsa('[data-allck]',function(el){el.addEventListener('click',function(){
    var sid=el.dataset.allck;
    var s=S.studies.filter(function(x){return x.id===sid;})[0];if(!s)return;
    var enrolled=S.members.filter(function(m){return(m.studyIds||[]).indexOf(sid)>=0;});
    var open=openWeeks(s);
    if(!enrolled.length||!open.length){alert('배정된 멤버나 열린 주차가 없어요.');return;}
    if(!confirm('['+s.name+'] 참여 멤버 '+enrolled.length+'명 × 열린 주차 '+open.length+'개\n총 '+(enrolled.length*open.length)+'개를 전체 인증완료 처리할까요?'))return;
    var patch={};
    enrolled.forEach(function(m){
      open.forEach(function(w){setCk(sid,w.num,m.id,'done');patch[ckKey(sid,w.num,m.id)]='done';});
    });
    persistCk(patch);
  });});
  qsa('[data-sasgn]',function(el){el.addEventListener('change',function(e){
    var p=e.target.dataset.sasgn.split('__');var sid=p[0],mid=p[1];
    var m=S.members.filter(function(x){return x.id===mid;})[0];if(!m)return;
    m.studyIds=m.studyIds||[];
    if(e.target.checked){if(m.studyIds.indexOf(sid)<0)m.studyIds.push(sid);}
    else m.studyIds=m.studyIds.filter(function(x){return x!==sid;});persist();
  });});
}
function doAM(){
  var n=S.newMember.trim();if(!n){render();return;}
  if(S.members.filter(function(m){return m.name===n;}).length){alert('이미 같은 이름의 멤버가 있어요!');return;}
  var pwEl=document.getElementById('nm-pw');
  var pw=pwEl&&pwEl.value.trim()?pwEl.value.trim():'0000';
  var cbs=document.querySelectorAll('.nm-study-cb:checked');
  var studyIds=[];cbs.forEach(function(cb){studyIds.push(cb.value);});
  S.members.push({id:uid(),name:n,pw:pw,studyIds:studyIds});
  S.members.sort(function(a,b){try{return a.name.localeCompare(b.name,'ko');}catch(e){return a.name<b.name?-1:a.name>b.name?1:0;}});
  S.newMember='';persist();
}
function doDM(id){
  if(!confirm('이 멤버를 삭제할까요?'))return;
  S.members=S.members.filter(function(m){return m.id!==id;});
  if(S.expandedMem===id)S.expandedMem=null;persist();
}
async function persist(){
  S.saving=true;
  // 체크인은 별도(persistCk/fbPatchCheckins)로만 저장하며, 여기서는 절대 건드리지 않는다.
  // (동시 접속 중인 다른 사용자의 체크인을 오래된 로컬 스냅샷으로 덮어쓰는 것을 방지)
  try{await fetch(FIREBASE_URL+DB_PATH,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({studies:S.studies,members:S.members,catOrder:S.catOrder,events:S.events})}).then(function(r){if(!r.ok)throw new Error(r.status);});}
  catch(e){alert('저장 실패. 인터넷 연결을 확인해주세요.');}
  S.saving=false;render();
}
async function persistNotices(){
  try{await fbSaveNotices(S.notices);}
  catch(e){alert('공지 저장 실패. 인터넷 연결을 확인해주세요.');}
  render();
}
function applyData(d){
  S.studies=d&&d.studies&&d.studies.length?d.studies:JSON.parse(JSON.stringify(DEFAULT_STUDIES));
  var dbMems=d&&d.members&&d.members.length?d.members:[];
  if(dbMems.length){
    var exIds=dbMems.map(function(m){return m.id;});var exNames=dbMems.map(function(m){return m.name;});
    DEFAULT_MEMBERS.forEach(function(dm){if(exIds.indexOf(dm.id)<0&&exNames.indexOf(dm.name)<0)dbMems.push(JSON.parse(JSON.stringify(dm)));});
    S.members=dbMems;
  } else {S.members=JSON.parse(JSON.stringify(DEFAULT_MEMBERS));}
  S.checkins=d&&d.checkins?d.checkins:{};
  S.studies.forEach(function(s){
    if(!s.weeks||!s.weeks.length)s.weeks=[{num:1,locked:false,materialUrl:''}];
    if(s.applyOpen===undefined)s.applyOpen=false;
    if(s.dayOfWeek===undefined)s.dayOfWeek='';
    if(s.bandUrl===undefined)s.bandUrl='';
    if(s.startDate===undefined)s.startDate='';
    if(!s.snotices)s.snotices=[];
    s.weeks.forEach(function(w){if(w.materialUrl===undefined)w.materialUrl='';if(w.note===undefined)w.note='';});
  });
  // catOrder: Firebase에 저장된 순서 로드, 없으면 studies에서 추출
  var allCats=[];S.studies.forEach(function(s){if(allCats.indexOf(s.cat)<0)allCats.push(s.cat);});
  var savedOrder=d&&d.catOrder&&d.catOrder.length?d.catOrder:[];
  // 저장된 순서 기준으로 정렬, 새 카테고리는 맨 뒤에 추가
  S.events=d&&d.events?d.events:{};
  if(allCats.indexOf('루틴 체크')<0)allCats.unshift('루틴 체크');
  S.catOrder=savedOrder.filter(function(c){return allCats.indexOf(c)>=0;});
  allCats.forEach(function(c){if(S.catOrder.indexOf(c)<0)S.catOrder.push(c);});
  if(S.catOrder.indexOf('루틴 체크')<0)S.catOrder.unshift('루틴 체크');
  S.members.sort(function(a,b){try{return a.name.localeCompare(b.name,'ko');}catch(e){return a.name<b.name?-1:a.name>b.name?1:0;}});
  // 자동 로그인: 이 기기에서 마지막으로 로그인했던 멤버가 있으면 비번 없이 바로 로그인
  try{
    var savedMid=localStorage.getItem('kkang_member_id');
    if(savedMid){
      var savedM=S.members.filter(function(x){return x.id===savedMid;})[0];
      if(savedM){
        S.loggedMember=savedM;
        var lt=localStorage.getItem('kkang_last_tab');
        S.tab=(lt&&['ci','mp','apply','notice','cal','cp'].indexOf(lt)>=0)?lt:'ci';
      } else {
        localStorage.removeItem('kkang_member_id');
      }
    }
  }catch(e){}
  S.loading=false;render();
}
(async function(){
  render();
  var coreData=null;
  try{coreData=await fbLoad();}
  catch(e1){
    // 1회 재시도
    try{await new Promise(function(r){setTimeout(r,1500);});coreData=await fbLoad();}
    catch(e2){
      S.loading=false;
      var app=document.getElementById('app');
      if(app)app.innerHTML='<div class="loading">로드 실패. 인터넷 연결을 확인하고 새로고침해주세요.<br><br><button onclick="location.reload()" style="padding:.6rem 1.25rem;border-radius:20px;background:linear-gradient(135deg,#E91E8C,#7B2FF7);color:#fff;border:none;font-weight:700;cursor:pointer;">새로고침</button></div>';
      return;
    }
  }
  applyData(coreData);
  // 공지(이미지 포함)는 별도 경로에서 비동기로, 실패해도 앱은 정상 작동
  fbLoadNotices().then(function(nd){S.notices=nd||{};render();}).catch(function(){S.notices={};});
})();


</script>
